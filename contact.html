    <main>

        <h2 class="nabla-t2 floating center" >Contact</h2>
        <section class="container-contact">
         <iframe  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3151.8354345094244!2d144.96305761531666!3d-37.81627977975171!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x6ad642af0f11fd81%3A0xf5772f1a14aa46b1!2sFlinders%20Street%20Station!5e0!3m2!1sen!2sus!4v1618612345678!5m2!1sen!2sus" ></iframe>
         <div class="contact-form">
             <form action="https://aulamindhub.github.io/dwm_show_data/show_data.html" method="get" target="_blank">
                 <label for="name">Name:</label>
                 <input type="text" id="name" name="name" required>
                 
                 <label for="email">Email:</label>
                 <input type="email" id="email" name="email" required>
                 
                 <label>Interested Categories:</label>
                 <div class="categories">
                     <label><input type="checkbox" name="category" value="1"> Category 1</label>
                     <label><input type="checkbox" name="category" value="2"> Category 2</label>
                     <label><input type="checkbox" name="category" value="3"> Category 3</label>
                     <label><input type="checkbox" name="category" value="4"> Category 4</label>
                     <label><input type="checkbox" name="category" value="5"> Category 5</label>
                     <label><input type="checkbox" name="category" value="6"> Category 6</label>
                 </div>
                 
                 <label for="message">Message:</label><br>
                 <textarea id="message" name="message" rows="4" cols="50"></textarea>
                 
                 <label>Subscribe:</label>
                 <label><input type="radio" name="subscribe" value="yes"> Yes</label>
                 <label><input type="radio" name="subscribe" value="no"> No</label>
                 <div class="buttons">
                     <button type="submit">Send</button>
                 <button type="reset">Reset</button>
                 </div>
                

             </form>
         </div>
        </section>
